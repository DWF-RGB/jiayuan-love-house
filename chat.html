<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>爱的小助手</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#fff0f5;

font-family:"Microsoft YaHei",sans-serif;

display:flex;

flex-direction:column;

animation:fadeIn 0.8s ease;

}


/* 页面进入动画 */

@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}



/* 顶部 */

.header{

height:70px;

background:#ff8fb5;

color:white;

display:flex;

align-items:center;

justify-content:center;

position:relative;

font-size:21px;

font-weight:bold;

}



/* 返回按钮 */

.back{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:white;

text-decoration:none;

font-size:15px;

font-weight:normal;

}



/* 聊天区域 */

.chat{

flex:1;

padding:20px;

overflow-y:auto;

}



/* 气泡 */

.message{

max-width:80%;

padding:15px 18px;

margin-bottom:18px;

border-radius:22px;

font-size:16px;

line-height:1.7;

}


/* AI */

.ai{

background:white;

color:#555;

border-bottom-left-radius:5px;

}


/* 用户 */

.user{

background:#ff8fb5;

color:white;

margin-left:auto;

border-bottom-right-radius:5px;

}



/* 输入区域 */

.input-area{

display:flex;

padding:15px;

background:white;

border-top:1px solid #eee;

}



input{

flex:1;

height:45px;

border-radius:25px;

border:1px solid #ddd;

padding:0 18px;

font-size:16px;

outline:none;

}



button{

margin-left:10px;

width:70px;

border:none;

border-radius:25px;

background:#ff8fb5;

color:white;

font-size:16px;

}



</style>


</head>


<body>


<div class="header">


<a href=" " class="back">

← 回到小屋

</a >


💕 伟峰的小老婆专属助手


</div>



<div class="chat">


<div class="message ai">

佳源，欢迎来到伟峰给你准备的小屋 😊

<br><br>

我是专属于你的陪伴小助手。

今天过得怎么样呀？

</div>


<div class="message ai">

如果累了或者不开心，

先让我抱抱你 🫂

你不用马上变得坚强。

</div>



</div>



<div class="input-area">


<input placeholder="和我说说今天发生了什么...">


<button>

发送

</button>


</div>



</body>


</html>
