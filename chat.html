```html
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>佳源的小助手</title>


<style>

/* ==================================================
   基础
================================================== */

*{

    box-sizing:border-box;

}


html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

    overscroll-behavior:none;

}


body{

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    /*
       与主界面完全统一的
       明亮奶油粉背景
    */

    background:

    radial-gradient(
        circle at 8% 8%,
        #ffdce8 0%,
        transparent 30%
    ),

    radial-gradient(
        circle at 92% 92%,
        #ffe7d8 0%,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #fff3f6,
        #fff9f2
    );

    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;

    color:#555;

    /*
       防止手机浏览器出现
       横向拖动
    */

    touch-action:pan-y;

}


/* ==================================================
   顶部
================================================== */

.header{

    position:relative;

    width:100%;

    height:68px;

    min-height:68px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    rgba(255,253,250,0.96);

    border-bottom:
    1px solid #ffd9e4;

    box-shadow:

    0 3px 12px
    rgba(255,120,160,0.07);

    color:#ff5f91;

    font-size:18px;

    font-weight:500;

}


/* ==================================================
   回到小屋
================================================== */

.back{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    display:flex;

    align-items:center;

    gap:5px;

    color:#f0789f;

    text-decoration:none;

    font-size:15px;

    font-weight:normal;

    white-space:nowrap;

}


/* ==================================================
   聊天区域
================================================== */

.chat{

    flex:1;

    min-height:0;

    width:100%;

    padding:

    24px 18px 20px;

    overflow-y:auto;

    overflow-x:hidden;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

    scroll-behavior:smooth;

}


/* ==================================================
   滚动条
================================================== */

.chat::-webkit-scrollbar{

    width:5px;

}


.chat::-webkit-scrollbar-thumb{

    background:#ffbfd2;

    border-radius:10px;

}


.chat::-webkit-scrollbar-track{

    background:transparent;

}


/* ==================================================
   消息
================================================== */

.message{

    display:block;

    max-width:82%;

    padding:

    13px 16px;

    margin-bottom:18px;

    border-radius:20px;

    font-size:15px;

    line-height:1.8;

    word-break:break-word;

    overflow-wrap:break-word;

}


/* ==================================================
   AI 消息
================================================== */

.ai{

    margin-left:0;

    background:

    #fffdf9;

    color:#555;

    border:

    1px solid #f8dce5;

    border-bottom-left-radius:6px;

    box-shadow:

    0 5px 16px
    rgba(255,120,160,0.07);

}


/* ==================================================
   用户消息
================================================== */

.user{

    margin-left:auto;

    margin-right:0;

    background:

    linear-gradient(
        135deg,
        #ff9fbd,
        #ff87ad
    );

    color:white;

    border-bottom-right-radius:6px;

    box-shadow:

    0 6px 17px
    rgba(255,110,150,0.16);

}


/* ==================================================
   加载
================================================== */

.loading{

    color:#999;

    font-size:14px;

    background:#fffdf9;

}


/* ==================================================
   底部输入区域
================================================== */

.input-area{

    position:relative;

    width:100%;

    min-height:73px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:

    12px 15px 15px;

    background:

    rgba(255,253,250,0.97);

    border-top:

    1px solid #ffd9e4;

    box-shadow:

    0 -3px 12px
    rgba(255,120,160,0.06);

}


/* ==================================================
   输入框
================================================== */

input{

    flex:1;

    min-width:0;

    width:100%;

    height:46px;

    border-radius:25px;

    border:

    1px solid #ffcbd9;

    background:#fff9f7;

    padding:

    0 18px;

    font-family:inherit;

    font-size:15px;

    color:#555;

    outline:none;

    -webkit-appearance:none;

    appearance:none;

}


input:focus{

    border-color:#ff9fbd;

    box-shadow:

    0 0 0 3px
    rgba(255,130,170,0.12);

}


input::placeholder{

    color:#b89da6;

}


/* ==================================================
   发送按钮
================================================== */

button{

    flex-shrink:0;

    width:68px;

    height:46px;

    padding:0;

    border:none;

    border-radius:24px;

    background:

    linear-gradient(
        135deg,
        #ff9fbd,
        #ff87ad
    );

    color:white;

    font-family:inherit;

    font-size:15px;

    cursor:pointer;

    -webkit-appearance:none;

    appearance:none;

    box-shadow:

    0 6px 14px
    rgba(255,110,150,0.17);

}


button:active{

    transform:scale(0.96);

}


/* ==================================================
   手机端
================================================== */

@media(max-width:480px){

    .header{

        height:62px;

        min-height:62px;

        font-size:17px;

    }


    .back{

        left:14px;

        font-size:15px;

    }


    .chat{

        padding:

        20px 14px 16px;

    }


    .message{

        max-width:86%;

        padding:

        12px 15px;

        font-size:15px;

        line-height:1.75;

        margin-bottom:16px;

    }


    .input-area{

        min-height:67px;

        padding:

        10px 12px 13px;

    }


    input{

        height:44px;

        font-size:15px;

    }


    button{

        width:62px;

        height:44px;

        font-size:14px;

    }

}


/* ==================================================
   超小屏幕
================================================== */

@media(max-width:360px){

    .back{

        font-size:14px;

        left:10px;

    }


    .header{

        font-size:16px;

    }


    .input-area{

        gap:7px;

    }


    button{

        width:58px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<div class="header">


    <a
    href="/"
    class="back"
    >

        ← 回到小屋

    </a>


    佳源的小助手


</div>



<!-- ==================================================
     聊天区域
================================================== -->

<div
class="chat"
id="chat"
>


    <div class="message ai">

        佳源，欢迎回家 😊

        <br><br>

        我是伟峰偷偷藏在小屋里的小助手。

        <br><br>

        今天过得怎么样呀？

    </div>


</div>



<!-- ==================================================
     输入区域
================================================== -->

<div class="input-area">


    <input
        id="input"
        type="text"
        placeholder="和我说说今天发生了什么..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
    >


    <button
        id="sendButton"
        onclick="sendMessage()"
    >

        发送

    </button>


</div>



<script>


/* ==================================================
   获取元素
================================================== */

const chatBox =
document.getElementById("chat");


const input =
document.getElementById("input");


const sendButton =
document.getElementById("sendButton");



/* ==================================================
   聊天记录
================================================== */

let messages = [];



/* ==================================================
   添加消息
================================================== */

function addMessage(text,type){

    const div =
    document.createElement("div");


    div.className =
    "message " + type;


    div.innerHTML =
    text.replace(/\n/g,"<br>");


    chatBox.appendChild(div);


    requestAnimationFrame(function(){

        chatBox.scrollTop =
        chatBox.scrollHeight;

    });

}



/* ==================================================
   发送消息
================================================== */

async function sendMessage(){


    const text =
    input.value.trim();


    if(!text){

        return;

    }


    /* 用户消息 */

    addMessage(
        text,
        "user"
    );


    /* 保存 */

    messages.push({

        role:"user",

        content:text

    });


    /* 清空 */

    input.value="";


    /* 加载提示 */

    const loading =
    document.createElement("div");


    loading.className =
    "message ai loading";


    loading.innerHTML =
    "让我想想怎么回答你";


    chatBox.appendChild(loading);


    chatBox.scrollTop =
    chatBox.scrollHeight;



    try{


        const response =
        await fetch(
            "/api/chat",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    messages:
                    messages

                })

            }
        );



        const data =
        await response.json();


        /* 删除加载 */

        loading.remove();



        if(data.reply){


            addMessage(

                data.reply,

                "ai"

            );


            messages.push({

                role:"assistant",

                content:data.reply

            });


        }

        else{


            addMessage(

                "佳源，好像网络有一点小问题，再试一次好吗",

                "ai"

            );

        }


    }

    catch(error){


        loading.remove();


        addMessage(

            "抱抱，连接好像出了点问题",

            "ai"

        );

    }


}



/* ==================================================
   回车发送
================================================== */

input.addEventListener(

    "keydown",

    function(e){

        if(e.key==="Enter"){

            e.preventDefault();

            sendMessage();

        }

    }

);



/* ==================================================
   输入框获得焦点时
   保持页面位置稳定
================================================== */

input.addEventListener(

    "focus",

    function(){

        setTimeout(function(){

            window.scrollTo(0,0);

            chatBox.scrollTop =
            chatBox.scrollHeight;

        },100);

    }

);

</script>


</body>

</html>
```
