<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的小老婆专属助手</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#fff0f5;

font-family:"Microsoft YaHei",sans-serif;

display:flex;

flex-direction:column;

animation:fadeIn 0.8s ease;

}


@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}



/* 顶部 */

.header{

height:70px;

background:#ff8fb5;

color:white;

display:flex;

align-items:center;

justify-content:center;

position:relative;

font-size:20px;

font-weight:bold;

}



.back{

position:absolute;

left:18px;

color:white;

text-decoration:none;

font-size:15px;

font-weight:normal;

}



/* 聊天区域 */

.chat{

flex:1;

padding:20px;

overflow-y:auto;

}



/* 气泡 */

.message{

max-width:80%;

padding:14px 18px;

margin-bottom:15px;

border-radius:20px;

font-size:16px;

line-height:1.7;

}



.ai{

background:white;

color:#555;

border-bottom-left-radius:5px;

}



.user{

background:#ff8fb5;

color:white;

margin-left:auto;

border-bottom-right-radius:5px;

}




/* 输入 */

.input-area{

display:flex;

padding:15px;

background:white;

}



input{

flex:1;

height:45px;

border-radius:25px;

border:1px solid #ddd;

padding:0 18px;

font-size:16px;

outline:none;

}



button{

width:70px;

margin-left:10px;

border:none;

border-radius:25px;

background:#ff8fb5;

color:white;

font-size:16px;

}



</style>


</head>



<body>



<div class="header">


<a href="/" class="back">

← 回到小屋

</a>


💕 伟峰的小老婆专属助手


</div>



<div class="chat" id="chat">


<div class="message ai">

佳源，欢迎回家 😊

<br><br>

我是伟峰专门为你准备的小助手。

<br><br>

今天过得怎么样呀？

</div>


</div>



<div class="input-area">


<input 
id="input"
placeholder="和我说说今天发生了什么..."
>


<button onclick="sendMessage()">

发送

</button>


</div>





<script>


const chat=document.getElementById("chat");

const input=document.getElementById("input");



function addMessage(text,type){


let div=document.createElement("div");


div.className="message "+type;


div.innerHTML=text;


chat.appendChild(div);


chat.scrollTop=chat.scrollHeight;


}




function sendMessage(){


let text=input.value.trim();


if(text===""){

return;

}


// 添加佳源消息

addMessage(text,"user");


input.value="";


// 模拟思考

setTimeout(()=>{


let reply=getReply(text);


addMessage(reply,"ai");


},700);



}




function getReply(text){


if(
text.includes("累") ||
text.includes("压力") ||
text.includes("难过") ||
text.includes("不开心")
){


return `

抱抱伟峰的小老婆 🫂

<br><br>

今天是不是辛苦啦。

<br>

不管发生什么，

佳源已经很棒了。

<br><br>

先休息一下，

不要一个人扛所有事情 😊

`;

}



if(
text.includes("爱") ||
text.includes("喜欢") ||
text.includes("想你")
){


return `


当然爱呀 💕

<br><br>

伟峰的小老婆是很特别的人。

<br>

从2024年12月14日开始，

我们的故事就一直在继续。

<br><br>

以后还有很多地方，

想和你一起去。

`;

}



if(
text.includes("吃") ||
text.includes("美食")
){


return `


想吃什么告诉伟峰呀 😊

<br><br>

等伟峰忙完，

马上带你去吃好吃的 💕

`;

}



if(
text.includes("韩国")
){


return `


当然记得韩国旅行呀 🇰🇷

<br><br>

那段一起看风景、

一起经历新鲜事的日子，

一直都是很珍贵的回忆。

`;

}



return `


佳源，我在听呢 😊

<br><br>

虽然我现在只是小助手，

但是我会一直站在佳源这边。

<br><br>

和我说说发生什么啦？

`;

}



</script>


</body>


</html>
