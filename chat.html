<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的小老婆专属助手</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#fff0f5;

font-family:"Microsoft YaHei",sans-serif;

display:flex;

flex-direction:column;

}



.header{

height:70px;

background:#ff8fb5;

color:white;

display:flex;

align-items:center;

justify-content:center;

position:relative;

font-size:20px;

font-weight:bold;

}



.back{

position:absolute;

left:18px;

color:white;

text-decoration:none;

font-size:15px;

font-weight:normal;

}



.chat{

flex:1;

padding:20px;

overflow-y:auto;

}



.message{

max-width:80%;

padding:14px 18px;

margin-bottom:15px;

border-radius:20px;

font-size:16px;

line-height:1.7;

}



.ai{

background:white;

color:#555;

border-bottom-left-radius:5px;

}



.user{

background:#ff8fb5;

color:white;

margin-left:auto;

border-bottom-right-radius:5px;

}



.input-area{

display:flex;

padding:15px;

background:white;

}



input{

flex:1;

height:45px;

border-radius:25px;

border:1px solid #ddd;

padding:0 18px;

font-size:16px;

outline:none;

}



button{

width:70px;

margin-left:10px;

border:none;

border-radius:25px;

background:#ff8fb5;

color:white;

font-size:16px;

}



.loading{

font-size:14px;

color:#999;

}


</style>


</head>


<body>



<div class="header">


<a href="/" class="back">

← 回到小屋

</a>


💕 伟峰的小老婆专属助手


</div>




<div class="chat" id="chat">


<div class="message ai">

佳源，欢迎回家 😊

<br><br>

我是伟峰为你准备的小助手。

<br><br>

今天过得怎么样呀？

</div>


</div>




<div class="input-area">


<input 
id="input"
placeholder="和我说说今天发生了什么..."
>


<button onclick="sendMessage()">

发送

</button>


</div>





<script>



const chatBox =
document.getElementById("chat");


const input =
document.getElementById("input");



// 保存聊天记录

let messages = [];





function addMessage(text,type){


const div=document.createElement("div");


div.className="message "+type;


div.innerHTML=text.replace(/\n/g,"<br>");


chatBox.appendChild(div);


chatBox.scrollTop =
chatBox.scrollHeight;


}





async function sendMessage(){


const text=input.value.trim();


if(!text){

return;

}



// 用户消息

addMessage(text,"user");


// 保存

messages.push({

role:"user",

content:text

});


input.value="";



// 加载提示

const loading=document.createElement("div");

loading.className="message ai loading";

loading.innerHTML="伟峰的小助手正在想怎么抱抱你 🫂";


chatBox.appendChild(loading);



try{


const response =
await fetch("/api/chat",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({

messages:messages

})


});




const data =
await response.json();



// 删除等待

loading.remove();




if(data.reply){



addMessage(

data.reply,

"ai"

);



messages.push({

role:"assistant",

content:data.reply

});



}else{


addMessage(

"佳源，好像网络有一点小问题，再试一次好吗 😊",

"ai"

);


}



}

catch(error){



loading.remove();



addMessage(

"抱抱，连接好像出了点问题 🫂",

"ai"

);



}



}



// 回车发送


input.addEventListener(
"keydown",

function(e){


if(e.key==="Enter"){


sendMessage();


}


}

);



</script>



</body>


</html>
