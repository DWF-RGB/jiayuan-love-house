<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>佳源的小助手</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

    overscroll-behavior:none;

}


body{

    position:fixed;

    left:0;

    top:0;

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    background:#FFF5F7;

    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    sans-serif;

    color:#555555;

    overflow:hidden;

}


/* =========================
   顶部
========================= */

.header{

    position:relative;

    width:100%;

    height:68px;

    min-height:68px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#FFEAF0;

    border-bottom:1px solid #F8D2DE;

    color:#E87898;

    font-size:18px;

    font-weight:500;

}


/* =========================
   回到小屋
========================= */

.back{

    position:absolute;

    left:18px;

    top:50%;

    transform:translateY(-50%);

    color:#E87898;

    text-decoration:none;

    font-size:15px;

    font-weight:normal;

    white-space:nowrap;

}


/* =========================
   聊天区域
========================= */

.chat{

    flex:1;

    min-height:0;

    width:100%;

    padding:
    22px 18px 18px;

    overflow-y:auto;

    overflow-x:hidden;

    overscroll-behavior:contain;

    -webkit-overflow-scrolling:touch;

}


/* =========================
   滚动条
========================= */

.chat::-webkit-scrollbar{

    width:4px;

}


.chat::-webkit-scrollbar-thumb{

    background:#F3B9CA;

    border-radius:10px;

}


.chat::-webkit-scrollbar-track{

    background:transparent;

}


/* =========================
   消息
========================= */

.message{

    display:block;

    max-width:82%;

    padding:
    13px 16px;

    margin-bottom:17px;

    border-radius:20px;

    font-size:15px;

    line-height:1.8;

    word-break:break-word;

    overflow-wrap:break-word;

}


/* =========================
   AI 消息
========================= */

.ai{

    margin-left:0;

    background:#FFFFFF;

    color:#555555;

    border:1px solid #F5DCE3;

    border-bottom-left-radius:6px;

    box-shadow:
    0 4px 12px
    rgba(220,120,145,0.06);

}


/* =========================
   用户消息
========================= */

.user{

    margin-left:auto;

    margin-right:0;

    background:#FF8FB5;

    color:#FFFFFF;

    border-bottom-right-radius:6px;

    box-shadow:
    0 4px 12px
    rgba(220,100,135,0.10);

}


/* =========================
   加载提示
========================= */

.loading{

    color:#999999;

    font-size:14px;

    background:#FFFFFF;

}


/* =========================
   输入区域
========================= */

.input-area{

    position:relative;

    width:100%;

    min-height:73px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    12px 15px 15px;

    background:#FFF0F4;

    border-top:1px solid #F8D2DE;

}


/* =========================
   输入框
========================= */

input{

    flex:1;

    min-width:0;

    width:100%;

    height:46px;

    border-radius:25px;

    border:1px solid #F1C9D5;

    background:#FFFFFF;

    padding:
    0 18px;

    font-family:inherit;

    font-size:15px;

    color:#555555;

    outline:none;

    -webkit-appearance:none;

    appearance:none;

}


input:focus{

    border-color:#FF9FBC;

    box-shadow:
    0 0 0 3px
    rgba(255,143,181,0.10);

}


input::placeholder{

    color:#B79FA7;

}


/* =========================
   发送按钮
========================= */

button{

    flex-shrink:0;

    width:68px;

    height:46px;

    padding:0;

    border:none;

    border-radius:24px;

    background:#FF8FB5;

    color:#FFFFFF;

    font-family:inherit;

    font-size:15px;

    cursor:pointer;

    -webkit-appearance:none;

    appearance:none;

}


button:active{

    transform:scale(0.96);

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    .header{

        height:62px;

        min-height:62px;

        font-size:17px;

    }


    .back{

        left:14px;

        font-size:15px;

    }


    .chat{

        padding:
        18px 14px 15px;

    }


    .message{

        max-width:86%;

        padding:
        12px 15px;

        font-size:15px;

        line-height:1.75;

        margin-bottom:15px;

    }


    .input-area{

        min-height:67px;

        padding:
        10px 12px 13px;

    }


    input{

        height:44px;

        font-size:15px;

    }


    button{

        width:62px;

        height:44px;

        font-size:14px;

    }

}


/* =========================
   防止页面横向晃动
========================= */

body,
.header,
.chat,
.input-area{

    max-width:100vw;

    overflow-x:hidden;

}

</style>

</head>


<body>


<div class="header">


    <a
    href="/"
    class="back"
    >

        ← 回到小屋

    </a>


    佳源的小助手


</div>



<div
class="chat"
id="chat"
>


    <div class="message ai">

        佳源，欢迎回家 😊

        <br><br>

        我是伟峰偷偷藏在小屋里的小助手。

        <br><br>

        今天过得怎么样呀？

    </div>


</div>



<div class="input-area">


    <input
        id="input"
        type="text"
        placeholder="和我说说今天发生了什么..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
    >


    <button
        id="sendButton"
        onclick="sendMessage()"
    >

        发送

    </button>


</div>



<script>


const chatBox =
document.getElementById("chat");


const input =
document.getElementById("input");


let messages = [];



function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.innerHTML =
    text.replace(/\n/g,"<br>");

    chatBox.appendChild(div);

    requestAnimationFrame(function(){

        chatBox.scrollTop =
        chatBox.scrollHeight;

    });

}



async function sendMessage(){


    const text =
    input.value.trim();


    if(!text){

        return;

    }


    addMessage(
        text,
        "user"
    );


    messages.push({

        role:"user",

        content:text

    });


    input.value="";


    const loading =
    document.createElement("div");


    loading.className =
    "message ai loading";


    loading.innerHTML =
    "让我想想怎么回答你";


    chatBox.appendChild(loading);


    chatBox.scrollTop =
    chatBox.scrollHeight;



    try{


        const response =
        await fetch(
            "/api/chat",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    messages:
                    messages

                })

            }
        );


        const data =
        await response.json();


        loading.remove();


        if(data.reply){

            addMessage(
                data.reply,
                "ai"
            );


            messages.push({

                role:"assistant",

                content:data.reply

            });

        }

        else{

            addMessage(
                "佳源，好像网络有一点小问题，再试一次好吗",
                "ai"
            );

        }


    }

    catch(error){

        loading.remove();

        addMessage(
            "抱抱，连接好像出了点问题",
            "ai"
        );

    }

}


/* 回车发送 */

input.addEventListener(

    "keydown",

    function(e){

        if(e.key==="Enter"){

            e.preventDefault();

            sendMessage();

        }

    }

);


/* 防止输入框聚焦时页面乱动 */

input.addEventListener(

    "focus",

    function(){

        document.body.style.position="fixed";

        document.body.style.overflow="hidden";

    }

);

</script>


</body>

</html>
