<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源的小助手</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

}

body{

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(255,210,225,0.5),
        transparent 28%
    ),
    linear-gradient(
        135deg,
        #fff1f6,
        #fffafd
    );

    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;

    display:flex;

    flex-direction:column;

    color:#666;

}


/* =========================
   顶部
========================= */

.header{

    height:68px;

    flex-shrink:0;

    background:
    rgba(255,255,255,0.88);

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid #ffe2eb;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    color:#e96f98;

    font-size:18px;

    font-weight:500;

}


/* 返回 */

.back{

    position:absolute;

    left:17px;

    display:flex;

    align-items:center;

    gap:4px;

    color:#e993af;

    text-decoration:none;

    font-size:14px;

    font-weight:normal;

}


/* =========================
   聊天区域
========================= */

.chat{

    flex:1;

    padding:
    24px 18px 20px;

    overflow-y:auto;

    scroll-behavior:smooth;

}


/* 滚动条 */

.chat::-webkit-scrollbar{

    width:5px;

}

.chat::-webkit-scrollbar-thumb{

    background:#f5c8d7;

    border-radius:10px;

}


/* =========================
   消息
========================= */

.message{

    position:relative;

    max-width:82%;

    padding:
    13px 16px;

    margin-bottom:18px;

    border-radius:20px;

    font-size:15px;

    line-height:1.8;

    word-break:break-word;

}


/* =========================
   AI消息
========================= */

.ai{

    margin-left:8px;

    background:
    rgba(255,255,255,0.95);

    color:#666;

    border:
    1px solid #ffe5ed;

    border-bottom-left-radius:6px;

    box-shadow:
    0 5px 18px rgba(230,140,170,0.08);

}


/* AI小头像 */

.ai::before{

    content:"💕";

    position:absolute;

    left:-8px;

    top:-10px;

    width:25px;

    height:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    border-radius:50%;

    font-size:13px;

    box-shadow:
    0 3px 8px rgba(220,130,160,0.12);

}


/* =========================
   用户消息
========================= */

.user{

    margin-left:auto;

    margin-right:3px;

    background:
    linear-gradient(
        135deg,
        #ff9fbd,
        #ff8fb5
    );

    color:white;

    border-bottom-right-radius:6px;

    box-shadow:
    0 5px 15px rgba(255,130,165,0.15);

}


/* 用户小头像 */

.user::after{

    content:"🌸";

    position:absolute;

    right:-7px;

    top:-10px;

    width:25px;

    height:25px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

    border-radius:50%;

    font-size:13px;

    box-shadow:
    0 3px 8px rgba(220,130,160,0.12);

}


/* =========================
   加载状态
========================= */

.loading{

    color:#aaa;

    font-size:14px;

    background:
    rgba(255,255,255,0.75);

}


/* =========================
   输入区域
========================= */

.input-area{

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    12px 15px 15px;

    background:
    rgba(255,255,255,0.9);

    border-top:
    1px solid #ffe5ed;

}


/* 输入框 */

input{

    flex:1;

    height:46px;

    border-radius:25px;

    border:
    1px solid #f3d5df;

    background:#fffafd;

    padding:
    0 18px;

    font-size:15px;

    color:#666;

    outline:none;

    transition:
    border 0.2s ease,
    box-shadow 0.2s ease;

}


/* 输入框获得焦点 */

input:focus{

    border-color:#f3a5bd;

    box-shadow:
    0 0 0 3px rgba(255,170,195,0.12);

}


/* placeholder */

input::placeholder{

    color:#c6aab4;

}


/* =========================
   发送按钮
========================= */

button{

    flex-shrink:0;

    width:68px;

    height:46px;

    border:none;

    border-radius:24px;

    background:
    linear-gradient(
        135deg,
        #ff9fbd,
        #ff87b0
    );

    color:white;

    font-size:15px;

    cursor:pointer;

    box-shadow:
    0 5px 12px rgba(255,130,165,0.18);

    transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;

}


button:active{

    transform:scale(0.96);

    box-shadow:
    0 2px 7px rgba(255,130,165,0.15);

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    .header{

        height:62px;

        font-size:17px;

    }


    .back{

        left:14px;

        font-size:13px;

    }


    .chat{

        padding:
        20px 14px 16px;

    }


    .message{

        max-width:86%;

        padding:
        12px 15px;

        font-size:15px;

        line-height:1.75;

        margin-bottom:16px;

    }


    .input-area{

        padding:
        10px 12px 13px;

    }


    input{

        height:44px;

        font-size:15px;

    }


    button{

        width:62px;

        height:44px;

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     顶部
========================= -->

<div class="header">


    <a href="/" class="back">

        ← 回到小屋

    </a>


    💕 佳源的小助手


</div>



<!-- =========================
     聊天区域
========================= -->

<div class="chat" id="chat">


    <div class="message ai">

        佳源，欢迎回家 😊

        <br><br>

        我是伟峰偷偷藏在小屋里的小助手。

        <br><br>

        今天过得怎么样呀？

    </div>


</div>



<!-- =========================
     输入区域
========================= -->

<div class="input-area">


    <input
        id="input"
        placeholder="和我说说今天发生了什么..."
        autocomplete="off"
    >


    <button onclick="sendMessage()">

        发送

    </button>


</div>



<script>


/* =========================
   获取元素
========================= */

const chatBox =
document.getElementById("chat");


const input =
document.getElementById("input");



/* =========================
   聊天记录
========================= */

let messages = [];



/* =========================
   添加消息
========================= */

function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.innerHTML =
    text.replace(/\n/g,"<br>");

    chatBox.appendChild(div);

    chatBox.scrollTop =
    chatBox.scrollHeight;

}



/* =========================
   发送消息
========================= */

async function sendMessage(){


    const text =
    input.value.trim();


    if(!text){

        return;

    }


    /* 用户消息 */

    addMessage(
        text,
        "user"
    );


    /* 保存 */

    messages.push({

        role:"user",

        content:text

    });


    /* 清空 */

    input.value="";


    /* 加载提示 */

    const loading =
    document.createElement("div");


    loading.className =
    "message ai loading";


    loading.innerHTML =
    "让我想想怎么抱抱你 🫂";


    chatBox.appendChild(loading);


    chatBox.scrollTop =
    chatBox.scrollHeight;



    try{


        const response =
        await fetch(
            "/api/chat",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    messages:
                    messages

                })

            }
        );



        const data =
        await response.json();


        /* 删除加载 */

        loading.remove();



        if(data.reply){


            addMessage(

                data.reply,

                "ai"

            );


            messages.push({

                role:"assistant",

                content:data.reply

            });


        }

        else{


            addMessage(

                "佳源，好像网络有一点小问题，再试一次好吗 😊",

                "ai"

            );

        }


    }

    catch(error){


        loading.remove();


        addMessage(

            "抱抱，连接好像出了点问题 🫂",

            "ai"

        );


    }

}



/* =========================
   回车发送
========================= */

input.addEventListener(

    "keydown",

    function(e){

        if(e.key==="Enter"){

            sendMessage();

        }

    }

);

</script>


</body>

</html>
```
