<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源的小助手</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

}

body{

    /*
       明亮奶油粉背景
       不使用灰粉色
    */

    background:

    radial-gradient(
        circle at 8% 8%,
        #ffdce8 0%,
        transparent 30%
    ),

    radial-gradient(
        circle at 92% 92%,
        #ffe7d8 0%,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #fff3f6,
        #fff9f2
    );

    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;

    display:flex;

    flex-direction:column;

    color:#555;

}


/* =========================
   顶部
========================= */

.header{

    height:68px;

    flex-shrink:0;

    /*
       奶油白顶部
    */

    background:
    rgba(255,253,250,0.94);

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid #f8dce5;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    color:#ec7098;

    font-size:18px;

    font-weight:500;

    box-shadow:
    0 2px 10px rgba(245,150,175,0.08);

}


/* =========================
   回到小屋
========================= */

.back{

    position:absolute;

    left:18px;

    display:flex;

    align-items:center;

    gap:5px;

    color:#e681a2;

    text-decoration:none;

    font-size:15px;

    font-weight:normal;

}


/* =========================
   聊天区域
========================= */

.chat{

    flex:1;

    min-height:0;

    padding:
    24px 18px 20px;

    overflow-y:auto;

    overflow-x:hidden;

    scroll-behavior:smooth;

}


/* =========================
   滚动条
========================= */

.chat::-webkit-scrollbar{

    width:5px;

}

.chat::-webkit-scrollbar-thumb{

    background:#f5bfd0;

    border-radius:10px;

}

.chat::-webkit-scrollbar-track{

    background:transparent;

}


/* =========================
   消息
========================= */

.message{

    max-width:82%;

    padding:
    13px 16px;

    margin-bottom:18px;

    border-radius:20px;

    font-size:15px;

    line-height:1.8;

    word-break:break-word;

}


/* =========================
   AI消息
========================= */

.ai{

    margin-left:0;

    /*
       奶油白
    */

    background:
    #fffdf9;

    color:#555;

    border:
    1px solid #f7e3e8;

    border-bottom-left-radius:6px;

    box-shadow:
    0 5px 16px rgba(245,145,170,0.07);

}


/* =========================
   用户消息
========================= */

.user{

    margin-left:auto;

    margin-right:0;

    /*
       清爽明亮的珊瑚粉
    */

    background:
    linear-gradient(
        135deg,
        #ff9fbd,
        #ff8daf
    );

    color:white;

    border-bottom-right-radius:6px;

    box-shadow:
    0 6px 17px rgba(255,125,160,0.16);

}


/* =========================
   加载状态
========================= */

.loading{

    color:#999;

    font-size:14px;

    background:
    #fffdf9;

}


/* =========================
   输入区域
========================= */

.input-area{

    flex-shrink:0;

    display:flex;

    align-items:center;

    gap:10px;

    padding:
    12px 15px 15px;

    /*
       明亮奶油色
    */

    background:
    rgba(255,253,249,0.96);

    border-top:
    1px solid #f8dfe6;

    box-shadow:
    0 -3px 12px rgba(245,150,175,0.05);

}


/* =========================
   输入框
========================= */

input{

    flex:1;

    height:46px;

    border-radius:25px;

    border:
    1px solid #f3d5df;

    background:
    #fffaf8;

    padding:
    0 18px;

    font-size:15px;

    color:#555;

    outline:none;

    transition:
    border 0.2s ease,
    box-shadow 0.2s ease;

}


input:focus{

    border-color:#ffabc2;

    box-shadow:
    0 0 0 3px
    rgba(255,170,195,0.12);

}


input::placeholder{

    color:#bba4aa;

}


/* =========================
   发送按钮
========================= */

button{

    flex-shrink:0;

    width:68px;

    height:46px;

    border:none;

    border-radius:24px;

    /*
       明亮粉色
    */

    background:
    linear-gradient(
        135deg,
        #ff9fbd,
        #ff87ad
    );

    color:white;

    font-size:15px;

    cursor:pointer;

    box-shadow:
    0 6px 14px rgba(255,125,160,0.17);

    transition:
    transform 0.15s ease;

}


button:active{

    transform:
    scale(0.96);

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    .header{

        height:62px;

        font-size:17px;

    }


    .back{

        left:14px;

        font-size:15px;

    }


    .chat{

        padding:
        20px 14px 16px;

    }


    .message{

        max-width:86%;

        padding:
        12px 15px;

        font-size:15px;

        line-height:1.75;

        margin-bottom:16px;

    }


    .input-area{

        padding:
        10px 12px 13px;

    }


    input{

        height:44px;

        font-size:15px;

    }


    button{

        width:62px;

        height:44px;

        font-size:14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     顶部
========================= -->

<div class="header">


    <a href="/" class="back">

        ← 回到小屋

    </a>


    佳源的小助手


</div>



<!-- =========================
     聊天区域
========================= -->

<div class="chat" id="chat">


    <div class="message ai">

        佳源，欢迎回家 😊

        <br><br>

        我是伟峰偷偷藏在小屋里的小助手。

        <br><br>

        今天过得怎么样呀？

    </div>


</div>



<!-- =========================
     输入区域
========================= -->

<div class="input-area">


    <input
        id="input"
        placeholder="和我说说今天发生了什么..."
        autocomplete="off"
    >


    <button onclick="sendMessage()">

        发送

    </button>


</div>



<script>


/* =========================
   获取元素
========================= */

const chatBox =
document.getElementById("chat");


const input =
document.getElementById("input");



/* =========================
   聊天记录
========================= */

let messages = [];



/* =========================
   添加消息
========================= */

function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.innerHTML =
    text.replace(/\n/g,"<br>");

    chatBox.appendChild(div);

    chatBox.scrollTop =
    chatBox.scrollHeight;

}



/* =========================
   发送消息
========================= */

async function sendMessage(){


    const text =
    input.value.trim();


    if(!text){

        return;

    }


    addMessage(
        text,
        "user"
    );


    messages.push({

        role:"user",

        content:text

    });


    input.value="";


    const loading =
    document.createElement("div");


    loading.className =
    "message ai loading";


    loading.innerHTML =
    "让我想想怎么回答你";


    chatBox.appendChild(loading);


    chatBox.scrollTop =
    chatBox.scrollHeight;



    try{


        const response =
        await fetch(
            "/api/chat",
            {

                method:"POST",

                headers:{

                    "Content-Type":
                    "application/json"

                },

                body:
                JSON.stringify({

                    messages:
                    messages

                })

            }
        );



        const data =
        await response.json();


        loading.remove();



        if(data.reply){


            addMessage(

                data.reply,

                "ai"

            );


            messages.push({

                role:"assistant",

                content:data.reply

            });


        }

        else{


            addMessage(

                "佳源，好像网络有一点小问题，再试一次好吗",

                "ai"

            );

        }


    }

    catch(error){


        loading.remove();


        addMessage(

            "抱抱，连接好像出了点问题",

            "ai"

        );

    }

}



/* =========================
   回车发送
========================= */

input.addEventListener(

    "keydown",

    function(e){

        if(e.key==="Enter"){

            sendMessage();

        }

    }

);

</script>


</body>

</html>
