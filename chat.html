<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>爱的小助手</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#fff0f5;

font-family:"Microsoft YaHei";

display:flex;

flex-direction:column;

}


.header{

background:#ff8fb5;

color:white;

padding:20px;

text-align:center;

font-size:22px;

}


.chat{

flex:1;

padding:20px;

overflow:auto;

}


.message{

max-width:75%;

padding:15px;

margin:15px 0;

border-radius:20px;

font-size:16px;

line-height:1.6;

}


.ai{

background:white;

align-self:flex-start;

}


.user{

background:#ff8fb5;

color:white;

margin-left:auto;

}


.input{

display:flex;

padding:15px;

background:white;

}


input{

flex:1;

padding:15px;

border-radius:30px;

border:1px solid #ddd;

font-size:16px;

}


button{

margin-left:10px;

border:none;

background:#ff8fb5;

color:white;

border-radius:30px;

padding:0 20px;

}
.back{

position:absolute;

left:20px;

top:20px;

color:white;

text-decoration:none;

font-size:15px;

}


body{

animation:fadeIn 0.8s ease;

}


@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}

</style>

</head>


<body>


<div class="header">

<a href=" " class="back">
← 回到小屋
</a >

<div>
💕 伟峰的小老婆专属助手
</div>

</div>



<div class="chat">


<div class="message ai">

佳源，欢迎来到伟峰给你准备的小屋 😊

<br><br>

今天过得怎么样呀？

</div>



<div class="message ai">

不管发生什么，

先给你一个抱抱 🫂

</div>


</div>



<div class="input">

<input placeholder="和我说说今天发生了什么...">

<button>

发送

</button>

</div>


</body>


</html>
