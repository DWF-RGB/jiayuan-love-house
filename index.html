<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源充满爱的小屋</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    padding:0;

    min-height:100%;

}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;


    /*

       正常、干净的浅粉色

       不灰
       不棕
       不发暗

    */

    background:#FFF0F5;


    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    sans-serif;

}


/* =========================
   主卡片
========================= */

.box{

    width:100%;

    max-width:420px;

    padding:
    44px 26px 36px;

    background:#FFFFFF;

    border-radius:30px;

    text-align:center;


    box-shadow:

    0 15px 40px
    rgba(255,107,157,0.16);

}


/* =========================
   主标题
========================= */

h1{

    margin:0;

    font-family:
    "Microsoft YaHei",
    sans-serif;

    font-size:31px;

    font-weight:600;

    line-height:1.45;

    letter-spacing:0.5px;


    /*

       正常明亮粉色

    */

    color:#FF6B9D;

}


/* =========================
   小房子
========================= */

.house{

    display:block;

    margin-bottom:6px;

    font-size:30px;

}


/* =========================
   副标题
========================= */

.subtitle{

    margin-top:12px;

    margin-bottom:30px;

    font-size:17px;

    line-height:1.7;

    color:#FF8FB5;

}


/* =========================
   正文
========================= */

.text{

    padding:
    0 7px;

    font-size:16px;

    line-height:2;

    color:#555555;

}


.welcome{

    font-size:18px;

    color:#555555;

}


.love{

    color:#FF6B9D;

}


/* =========================
   按钮区域
========================= */

.buttons{

    margin-top:32px;

}


/* =========================
   按钮
========================= */

.buttons a{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    min-height:58px;

    margin:13px 0;

    padding:
    14px 18px;

    border-radius:18px;


    /*

       干净浅粉

    */

    background:#FFE4EC;


    border:
    1px solid #FFC4D5;


    color:#FF6B9D;


    text-decoration:none;

    font-size:17px;

    font-weight:500;

    letter-spacing:0.3px;


    box-shadow:

    0 5px 15px
    rgba(255,107,157,0.08);


    transition:
    transform 0.2s ease,
    background 0.2s ease;

}


/* =========================
   鼠标经过
========================= */

.buttons a:hover{

    transform:
    translateY(-2px);

    background:#FFDCE7;

}


/* =========================
   点击
========================= */

.buttons a:active{

    transform:
    scale(0.98);

}


/* =========================
   底部
========================= */

.footer{

    margin-top:27px;

    font-size:13px;

    letter-spacing:1px;

    color:#FF9FBC;

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    body{

        padding:
        18px 15px;

    }


    .box{

        padding:
        37px 22px 29px;

        border-radius:27px;

    }


    h1{

        font-size:28px;

    }


    .house{

        font-size:28px;

    }


    .subtitle{

        font-size:16px;

        margin-top:10px;

        margin-bottom:26px;

    }


    .text{

        font-size:15px;

        line-height:1.9;

    }


    .welcome{

        font-size:17px;

    }


    .buttons{

        margin-top:27px;

    }


    .buttons a{

        min-height:55px;

        margin:11px 0;

        border-radius:17px;

    }


    .footer{

        margin-top:24px;

        font-size:12px;

    }

}

</style>

</head>


<body>


<div class="box">


    <!-- 主标题 -->

    <h1>

        <span class="house">🏡</span>

        佳源充满爱的小屋

    </h1>


    <!-- 副标题 -->

    <div class="subtitle">

        伟峰给佳源的休闲爱乐园 💕

    </div>


    <!-- 正文 -->

    <div class="text">

        <div class="welcome">

            欢迎回来，佳源

            <span class="love">♡</span>

        </div>


        <br>


        这里藏着伟峰准备的小惊喜，

        <br>

        也藏着属于我们的故事。


        <br><br>


        希望你每一次打开这里，

        <br>

        都能感觉到一点点开心，

        <br>

        和很多很多的爱。

    </div>


    <!-- 按钮 -->

    <div class="buttons">


        <a href="chat.html">

            💕 爱的小助手

        </a>


        <a href="letter.html">

            💌 伟峰的情话信箱

        </a>


        <a href="story.html">

            📖 我们的故事

        </a>


    </div>


    <!-- 底部 -->

    <div class="footer">

        made with love ♡

    </div>


</div>


</body>

</html>
