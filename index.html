<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源充满爱的小屋</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;


    background:
    linear-gradient(135deg,#ffeaf3,#fff9fc);


    font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}


/* 小屋主体 */

.box{

    width:100%;

    max-width:420px;


    background:
    rgba(255,255,255,0.95);


    padding:50px 28px;


    border-radius:35px;


    text-align:center;


    box-shadow:

    0 20px 50px rgba(255,120,160,0.18);

}


/* 标题 */

h1{


    font-size:32px;


    color:#ff6597;


    line-height:1.4;


    margin:0 0 15px;


    font-weight:700;

}


/* 副标题 */

.subtitle{


    font-size:19px;


    color:#ff8fb5;


    margin-bottom:38px;


}


/* 正文 */

.text{


    font-size:17px;


    line-height:2;


    color:#666;


}


/* 按钮区域 */

.buttons{


    margin-top:40px;

}



/* 按钮 */

.buttons a{


    display:block;


    width:90%;


    margin:16px auto;


    padding:17px;


    border-radius:50px;


    background:

    linear-gradient(
    135deg,
    #ff9bc0,
    #ff6f9e
    );


    color:white;


    text-decoration:none;


    font-size:18px;


    box-shadow:

    0 8px 20px rgba(255,120,160,0.25);


    transition:0.3s;


}


/* 点击效果 */

.buttons a:hover{


    transform:translateY(-3px);


}



/* 手机优化 */

@media(max-width:400px){

.box{

padding:40px 22px;

}


h1{

font-size:28px;

}


.text{

font-size:16px;

}

}


</style>

</head>



<body>


<div class="box">


<h1>

🏡<br>

佳源充满爱的小屋

</h1>



<div class="subtitle">

伟峰为佳源准备的一方小天地 💕

</div>



<div class="text">


欢迎回来，佳源～


<br><br>


这里藏着伟峰准备的小惊喜，

<br>

也收藏着属于我们的点点滴滴。


<br><br>


希望每一次打开，

<br>

都能让你开心一点 ❤️


</div>



<div class="buttons">


<a href="chat.html">

💕 和伟峰聊聊天

</a>



<a href="letter.html">

💌 伟峰写给你的信

</a>



<a href="story.html">

📖 我们的小故事

</a>


</div>


</div>


</body>

</html>
