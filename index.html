<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源充满爱的小屋</title>


<!-- 引入字体 -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">


<style>


*{
    box-sizing:border-box;
}



body{

    margin:0;

    min-height:100vh;


    display:flex;

    justify-content:center;

    align-items:center;


    padding:20px;


    background:

    linear-gradient(
        135deg,
        #ffe7f1,
        #fff9fc
    );


    font-family:

    "Noto Serif SC",
    serif;


}



/* 主体小屋 */


.box{


    width:100%;


    max-width:420px;


    background:

    rgba(255,255,255,0.92);



    padding:

    50px 28px;



    border-radius:35px;



    text-align:center;



    box-shadow:


    0 20px 60px

    rgba(255,120,160,0.22);



}



/* 标题 */


h1{


    font-family:

    "Ma Shan Zheng",
    cursive;



    font-size:42px;



    font-weight:normal;



    line-height:1.4;



    color:#ff6597;



    margin:


    0 0 18px;



}



/* 副标题 */


.subtitle{


    font-family:

    "Noto Serif SC",
    serif;



    font-size:20px;



    color:#ff8fb5;



    margin-bottom:38px;



}



/* 正文 */


.text{


    font-family:

    "Noto Serif SC",
    serif;



    font-size:18px;



    line-height:2;



    color:#666;



    letter-spacing:1px;



}



/* 按钮区域 */


.buttons{


    margin-top:42px;



}



/* 按钮 */


.buttons a{


    display:block;



    width:90%;



    margin:16px auto;



    padding:18px;



    border-radius:50px;



    background:


    linear-gradient(

    135deg,

    #ff9fc4,

    #ff719f

    );



    color:white;



    text-decoration:none;



    font-family:

    "Microsoft YaHei",
    sans-serif;



    font-size:18px;



    letter-spacing:1px;



    box-shadow:


    0 8px 20px

    rgba(255,120,160,0.25);



    transition:0.3s;



}



/* 鼠标效果 */


.buttons a:hover{


    transform:

    translateY(-3px);



    box-shadow:


    0 12px 30px

    rgba(255,120,160,0.35);



}



/* 手机优化 */


@media(max-width:400px){


    h1{


        font-size:36px;


    }



    .subtitle{


        font-size:18px;


    }



    .text{


        font-size:16px;


    }


}



</style>


</head>



<body>



<div class="box">



<h1>

🏡<br>

佳源充满爱的小屋

</h1>



<div class="subtitle">


伟峰给佳源的休闲爱乐园 💕


</div>




<div class="text">


欢迎回来，佳源～


<br><br>


这里藏着伟峰准备的小惊喜，


<br>


也藏着属于我们的故事。


<br><br>


希望每一次打开，


<br>


都能让你开心一点。


</div>




<div class="buttons">


<a href="chat.html">

💕 爱的小助手

</a>



<a href="letter.html">

💌 伟峰的情话信箱

</a>



<a href="story.html">

📖 我们的故事

</a>



</div>




</div>



</body>

</html>
