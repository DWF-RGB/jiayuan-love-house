<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>佳源充满爱的小屋</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    padding:0;

    min-height:100%;

}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
    24px 18px;


    /*

       明亮奶油粉背景

    */

    background:

    radial-gradient(
        circle at 8% 8%,
        #ffdce8 0%,
        transparent 30%
    ),

    radial-gradient(
        circle at 92% 92%,
        #ffe7d8 0%,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #fff3f6,
        #fff9f2
    );


    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;


    color:#555;

}


/* =========================
   小屋主体
========================= */

.box{

    position:relative;

    width:100%;

    max-width:430px;

    padding:
    42px 27px 34px;


    background:
    rgba(255,253,250,0.97);


    border-radius:30px;


    text-align:center;


    box-shadow:

    0 20px 55px
    rgba(245,150,175,0.16),

    0 4px 12px
    rgba(245,150,175,0.07);


    border:
    1px solid
    rgba(255,255,255,0.95);


    overflow:hidden;

}


/* =========================
   装饰爱心
========================= */

.box::before{

    content:"♡";

    position:absolute;

    top:15px;

    right:23px;

    font-size:24px;

    color:#ffb1c8;

    transform:rotate(12deg);

}


.box::after{

    content:"♡";

    position:absolute;

    bottom:18px;

    left:20px;

    font-size:20px;

    color:#ffc6d8;

    transform:rotate(-12deg);

}


/* =========================
   主标题
========================= */

h1{

    margin:0;

    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;

    font-size:30px;

    font-weight:600;

    line-height:1.45;

    letter-spacing:1px;


    /*
       更鲜艳、更明亮的珊瑚粉

    */

    color:#ff5f91;


}


/* =========================
   小房子
========================= */

.house{

    display:block;

    margin-bottom:7px;

    font-family:sans-serif;

    font-size:30px;

}


/* =========================
   副标题
========================= */

.subtitle{

    margin-top:12px;

    margin-bottom:30px;

    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;

    font-size:17px;

    line-height:1.7;

    letter-spacing:0.5px;


    /*
       更明亮的粉色

    */

    color:#f07ca1;

}


/* =========================
   正文
========================= */

.text{

    padding:
    0 7px;

    font-size:16px;

    line-height:2;

    letter-spacing:0.3px;

    color:#555;

}


.welcome{

    font-size:18px;

    color:#505050;

}


.love{

    color:#ff6d9b;

}


/* =========================
   按钮区域
========================= */

.buttons{

    margin-top:32px;

}


/* =========================
   按钮
========================= */

.buttons a{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    min-height:58px;

    margin:13px 0;

    padding:
    14px 18px;

    border-radius:18px;


    /*
       更明亮的粉色按钮

    */

    background:

    linear-gradient(
        135deg,
        #ffeaf2,
        #ffe1eb
    );


    border:
    1px solid
    #ffc5d7;


    /*
       更鲜艳的文字

    */

    color:#f45f8f;


    text-decoration:none;

    font-size:16px;

    letter-spacing:0.5px;


    box-shadow:

    0 5px 15px
    rgba(255,120,160,0.10);


    transition:

    transform 0.2s ease,

    background 0.2s ease,

    box-shadow 0.2s ease;

}


/* =========================
   鼠标经过
========================= */

.buttons a:hover{

    transform:
    translateY(-2px);


    background:

    linear-gradient(
        135deg,
        #ffe1eb,
        #ffd8e5
    );


    box-shadow:

    0 9px 22px
    rgba(255,110,150,0.18);

}


/* =========================
   点击
========================= */

.buttons a:active{

    transform:
    scale(0.98);

}


/* =========================
   按钮文字
========================= */

.button-title{

    display:block;

    font-size:17px;

    font-weight:500;

}


/* =========================
   底部
========================= */

.footer{

    margin-top:27px;

    font-size:13px;

    letter-spacing:1px;

    color:#f09ab5;

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    body{

        padding:
        18px 15px;

    }

        padding:
        36px 22px 28px;

        border-radius:27px;

    }

        font-size:28px;

    }

        font-size:28px;

    }


    .subtitle{

        font-size:16px;

        margin-top:10px;

    .text{

    .welcome{

        font-size:17px;

    }


    .buttons{

        margin-top:27px;

    }


    .buttons a{

        min-height:55px;

        margin:11px 0;

        border-radius:17px;

    }


    .button-title{

        font-size:16px;

    }


    .footer{

        margin-top:24px;

        font-size:12px;

    }

}

</style>

</head>

</div>


</body>

</html>
