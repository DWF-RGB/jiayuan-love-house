<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源充满爱的小屋</title>


<style>

/* =========================
   基础
========================= */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;

    padding:0;

    min-height:100%;

}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:
    24px 18px;

    /*
       和 Chat 页面统一的
       明亮奶油粉背景
    */

    background:

    radial-gradient(
        circle at 8% 8%,
        #ffdce8 0%,
        transparent 30%
    ),

    radial-gradient(
        circle at 92% 92%,
        #ffe7d8 0%,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #fff3f6,
        #fff9f2
    );

    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;

    color:#555;

}


/* =========================
   小屋主体
========================= */

.box{

    position:relative;

    width:100%;

    max-width:430px;

    padding:
    42px 27px 34px;

    /*
       奶油白
    */

    background:
    rgba(255,253,250,0.97);

    border-radius:30px;

    text-align:center;

    /*
       明亮、轻盈的暖粉阴影
    */

    box-shadow:

    0 20px 55px
    rgba(245,150,175,0.16),

    0 4px 12px
    rgba(245,150,175,0.07);

    border:
    1px solid rgba(255,255,255,0.95);

    overflow:hidden;

}


/* =========================
   装饰爱心
========================= */

.box::before{

    content:"♡";

    position:absolute;

    top:15px;

    right:23px;

    font-size:24px;

    color:#f3b6c9;

    transform:rotate(12deg);

}


.box::after{

    content:"♡";

    position:absolute;

    bottom:18px;

    left:20px;

    font-size:20px;

    color:#f6cad8;

    transform:rotate(-12deg);

}


/* =========================
   主标题
========================= */

h1{

    margin:0;

    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;

    font-size:30px;

    font-weight:600;

    line-height:1.45;

    letter-spacing:1px;

    /*
       明亮珊瑚粉
    */

    color:#ec7098;

}


/* =========================
   小房子
========================= */

.house{

    display:block;

    margin-bottom:7px;

    font-family:sans-serif;

    font-size:30px;

}


/* =========================
   副标题
========================= */

.subtitle{

    margin-top:12px;

    margin-bottom:30px;

    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;

    font-size:17px;

    line-height:1.7;

    letter-spacing:0.5px;

    /*
       不再使用灰粉
    */

    color:#df789b;

}


/* =========================
   正文
========================= */

.text{

    padding:
    0 7px;

    font-size:16px;

    line-height:2;

    letter-spacing:0.3px;

    color:#555;

}


.welcome{

    font-size:18px;

    color:#4f4f4f;

}


.love{

    color:#f083a6;

}


/* =========================
   按钮区域
========================= */

.buttons{

    margin-top:32px;

}


/* =========================
   按钮
========================= */

.buttons a{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    min-height:58px;

    margin:13px 0;

    padding:
    14px 18px;

    border-radius:18px;

    /*
       明亮浅粉
    */

    background:

    linear-gradient(
        135deg,
        #fff0f5,
        #ffe8ef
    );

    border:
    1px solid #f7cbd9;

    color:#df6f96;

    text-decoration:none;

    font-size:16px;

    letter-spacing:0.5px;

    box-shadow:

    0 5px 15px
    rgba(245,130,160,0.09);

    transition:

    transform 0.2s ease,

    background 0.2s ease,

    box-shadow 0.2s ease;

}


/* =========================
   鼠标经过
========================= */

.buttons a:hover{

    transform:
    translateY(-2px);

    background:

    linear-gradient(
        135deg,
        #ffe8ef,
        #ffdee8
    );

    box-shadow:

    0 9px 22px
    rgba(245,125,155,0.15);

}


/* =========================
   点击
========================= */

.buttons a:active{

    transform:
    scale(0.98);

}


/* =========================
   按钮文字
========================= */

.button-title{

    display:block;

    font-size:17px;

    font-weight:500;

}


/* =========================
   底部
========================= */

.footer{

    margin-top:27px;

    font-size:13px;

    letter-spacing:1px;

    color:#dc9caf;

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    body{

        padding:
        18px 15px;

    }


    .box{

        padding:
        36px 22px 28px;

        border-radius:27px;

    }


    h1{

        font-size:28px;

    }


    .house{

        font-size:28px;

    }


    .subtitle{

        font-size:16px;

        margin-top:10px;

        margin-bottom:26px;

    }


    .text{

        font-size:15px;

        line-height:1.9;

    }


    .welcome{

        font-size:17px;

    }


    .buttons{

        margin-top:27px;

    }


    .buttons a{

        min-height:55px;

        margin:11px 0;

        border-radius:17px;

    }


    .button-title{

        font-size:16px;

    }


    .footer{

        margin-top:24px;

        font-size:12px;

    }

}

</style>

</head>


<body>


<div class="box">

    </h1>


    <!-- =========================

    ========================= -->

    <div class="subtitle">

    <!-- =========================

    ========================= -->

    <div class="text">

        <div class="welcome">

            欢迎回来，佳源

            <span class="love">♡</span>

        </div>


        <br>

        和很多很多的爱。

    </div>


    <!-- =========================

    ========================= -->

    <div class="buttons">


        <a href="chat.html">

            <span class="button-title">

                💕 爱的小助手

            </span>

        </a>


        <a href="letter.html">

            <span class="button-title">

                💌 伟峰的情话信箱

            </span>

        </a>


        <a href="story.html">

            <span class="button-title">

                📖 我们的故事

            </span>

        </a>


    </div>


    <!-- =========================
         底部
    ========================= -->

    <div class="footer">

        made with love ♡

    </div>


</div>


</body>

</html>
```
