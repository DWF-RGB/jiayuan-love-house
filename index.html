<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>佳源充满爱的小屋</title>


<style>

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    padding:0;

    min-height:100%;

}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:24px 18px;


    /*

       温暖柔和的奶油暖粉

       不灰
       不亮
       不暗

    */

    background:

    radial-gradient(
        circle at 8% 8%,
        #FFE8EE 0%,
        transparent 30%
    ),

    radial-gradient(
        circle at 92% 92%,
        #FFE8E3 0%,
        transparent 30%
    ),

    linear-gradient(
        135deg,
        #FFF1F3,
        #FFF8F3
    );


    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    "Noto Sans SC",
    sans-serif;


    color:#555;

}


/* =========================
   小屋卡片
========================= */

.box{

    position:relative;

    width:100%;

    max-width:430px;

    padding:
    42px 27px 34px;


    /*

       温暖米白
       不使用纯白

    */

    background:#FFFBF8;


    border-radius:30px;


    text-align:center;


    /*
       非常柔和的暖色阴影
    */

    box-shadow:

    0 18px 45px
    rgba(210,125,145,0.13),

    0 3px 10px
    rgba(210,125,145,0.06);


    border:
    1px solid
    rgba(255,255,255,0.9);


    overflow:hidden;

}


/* =========================
   装饰爱心
========================= */

.box::before{

    content:"♡";

    position:absolute;

    top:15px;

    right:23px;

    font-size:24px;

    color:#EFB4C5;

    transform:rotate(12deg);

}


.box::after{

    content:"♡";

    position:absolute;

    bottom:18px;

    left:20px;

    font-size:20px;

    color:#F2C8D4;

    transform:rotate(-12deg);

}


/* =========================
   主标题
========================= */

h1{

    margin:0;

    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;


    font-size:30px;

    font-weight:600;

    line-height:1.45;

    letter-spacing:1px;


    /*
       柔和玫瑰粉

       比上一版明显柔和
    */

    color:#E87898;

}


/* =========================
   小房子
========================= */

.house{

    display:block;

    margin-bottom:7px;

    font-family:sans-serif;

    font-size:30px;

}


/* =========================
   副标题
========================= */

.subtitle{

    margin-top:12px;

    margin-bottom:30px;


    font-family:
    "STKaiti",
    "KaiTi",
    "Microsoft YaHei",
    sans-serif;


    font-size:17px;

    line-height:1.7;

    letter-spacing:0.5px;


    color:#D9859F;

}


/* =========================
   正文
========================= */

.text{

    padding:
    0 7px;

    font-size:16px;

    line-height:2;

    letter-spacing:0.3px;

    color:#555;

}


.welcome{

    font-size:18px;

    color:#505050;

}


.love{

    color:#E87898;

}


/* =========================
   按钮
========================= */

.buttons{

    margin-top:32px;

}


.buttons a{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;


    width:100%;

    min-height:58px;


    margin:13px 0;

    padding:14px 18px;


    border-radius:18px;


    /*
       柔和暖粉

       不刺眼
    */

    background:

    linear-gradient(
        135deg,
        #FDE8ED,
        #FBE3E7
    );


    border:
    1px solid #F3CBD7;


    color:#D96F91;


    text-decoration:none;


    font-size:16px;

    letter-spacing:0.5px;


    box-shadow:

    0 5px 15px
    rgba(210,120,145,0.08);


    transition:

    transform 0.2s ease,

    background 0.2s ease,

    box-shadow 0.2s ease;

}


/* =========================
   鼠标经过
========================= */

.buttons a:hover{

    transform:
    translateY(-2px);


    background:

    linear-gradient(
        135deg,
        #FBE1E8,
        #F9DDE4
    );


    box-shadow:

    0 8px 20px
    rgba(210,120,145,0.12);

}


/* =========================
   点击
========================= */

.buttons a:active{

    transform:
    scale(0.98);

}


/* =========================
   按钮文字
========================= */

.button-title{

    display:block;

    font-size:17px;

    font-weight:500;

}


/* =========================
   底部
========================= */

.footer{

    margin-top:27px;

    font-size:13px;

    letter-spacing:1px;

    color:#D89BAE;

}


/* =========================
   手机端
========================= */

@media(max-width:480px){

    body{

        padding:
        18px 15px;

    }


    .box{

        padding:
        36px 22px 28px;

        border-radius:27px;

    }


    h1{

        font-size:28px;

    }


    .house{

        font-size:28px;

    }


    .subtitle{

        font-size:16px;

        margin-top:10px;

        margin-bottom:26px;

    }


    .text{

        font-size:15px;

        line-height:1.9;

    }


    .welcome{

        font-size:17px;

    }


    .buttons{

        margin-top:27px;

    }


    .buttons a{

        min-height:55px;

        margin:11px 0;

        border-radius:17px;

    }


    .button-title{

        font-size:16px;

    }


    .footer{

        margin-top:24px;

        font-size:12px;

    }

}

</style>

</head>


<body>


<div class="box">


    <h1>

        <span class="house">🏡</span>

        佳源充满爱的小屋

    </h1>


    <div class="subtitle">

        伟峰给佳源的休闲爱乐园 💕

    </div>


    <div class="text">

        <div class="welcome">

            欢迎回来，佳源

            <span class="love">♡</span>

        </div>


        <br>


        这里藏着伟峰准备的小惊喜，

        <br>

        也藏着属于我们的故事。


        <br><br>


        希望你每一次打开这里，

        <br>

        都能感觉到一点点开心，

        <br>

        和很多很多的爱。

    </div>


    <div class="buttons">


        <a href="chat.html">

            <span class="button-title">

                💕 爱的小助手

            </span>

        </a>


        <a href="letter.html">

            <span class="button-title">

                💌 伟峰的情话信箱

            </span>

        </a>


        <a href="story.html">

            <span class="button-title">

                📖 我们的故事

            </span>

        </a>


    </div>


    <div class="footer">

        made with love ♡

    </div>


</div>


</body>

</html>
