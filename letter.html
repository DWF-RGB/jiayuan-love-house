<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的情话信箱</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;


background:

linear-gradient(
135deg,
#ffe8f0,
#fff9fc
);


font-family:
"Microsoft YaHei",
sans-serif;


animation:fadeIn 0.8s ease;

}



@keyframes fadeIn{

from{

opacity:0;

}

to{

opacity:1;

}

}



/* 返回按钮 */


.back{

position:fixed;

top:20px;

left:20px;


color:#ff8fb5;


text-decoration:none;


font-size:16px;

}



/* 主卡片 */


.box{

width:100%;


max-width:420px;


background:white;


padding:40px 25px;


border-radius:30px;


text-align:center;


box-shadow:

0 15px 35px rgba(255,120,160,0.2);


}



/* 标题 */


h1{

color:#ff6b9d;


font-size:30px;


margin-bottom:25px;


}



/* 信封 */


.envelope{


font-size:75px;


margin:25px;


animation:

float 2s infinite ease-in-out;


}



@keyframes float{


0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-8px);

}


}



/* 提示文字 */


.tip{


font-size:17px;


color:#777;


line-height:1.8;


}



/* 按钮 */


button{


margin-top:25px;


width:90%;


padding:18px;


border:none;


border-radius:50px;


background:


linear-gradient(
135deg,
#ff9fc4,
#ff7da8
);


color:white;


font-size:18px;


cursor:pointer;


box-shadow:

0 8px 20px rgba(255,120,160,0.25);


}



/* 信纸 */


.letter{


display:none;


margin-top:30px;


padding:28px;


background:#fffdf8;


border-radius:8px;


text-align:left;


font-size:17px;


line-height:2;


color:#666;


box-shadow:

0 10px 30px rgba(0,0,0,0.08);


animation:

letterShow 0.8s ease;


}



@keyframes letterShow{


from{

opacity:0;

transform:

translateY(40px);

}


to{

opacity:1;

transform:

translateY(0);

}


}



/* 日期 */


.date{


text-align:right;


font-size:14px;


color:#aaa;


margin-top:20px;


}



</style>


</head>



<body>



<a href="index.html" class="back">

← 回到小屋

</a>



<div class="box">



<h1>

💌 伟峰的情话信箱

</h1>




<div class="envelope">

💌

</div>



<div class="tip">

佳源，

<br>

今天想收到一封来自伟峰的信吗？😊

</div>




<button onclick="openLetter()">

拆开这封信 💕

</button>





<div class="letter" id="letter">


佳源：


<br><br>


其实我一直觉得，

人生里最幸运的事情，

就是遇见你。


<br><br>


从2024年12月14日开始，

我们的故事慢慢展开。


<br><br>


一起去韩国旅行，

一起做海鲜葱饼，

一起在杨村三中的天台留下回忆。


<br><br>


希望以后还有很多很多普通的日子，

可以和你一起吃饭，

一起散步，

一起创造新的故事。


<br><br>


无论什么时候，

伟峰都会站在你这边。


<br><br>


爱你的伟峰 ❤️



<div class="date">

2026年8月11日

</div>


</div>




</div>




<script>


function openLetter(){


let letter=document.getElementById("letter");


letter.style.display="block";


document.querySelector("button").style.display="none";


document.querySelector(".tip").style.display="none";


}

</script>




</body>


</html>
