<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>伟峰的情话信箱</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:
linear-gradient(135deg,#ffe8f0,#fff);

font-family:"Microsoft YaHei",sans-serif;

}


.box{

width:100%;

max-width:420px;

background:white;

padding:40px 25px;

border-radius:30px;

text-align:center;

box-shadow:
0 15px 35px rgba(255,120,160,0.2);

}


h1{

color:#ff6b9d;

font-size:30px;

}


.envelope{

font-size:80px;

margin:30px;

}


button{

width:90%;

padding:18px;

border:none;

border-radius:50px;

background:#ff8fb5;

color:white;

font-size:18px;

}


.letter{

display:none;

margin-top:30px;

padding:25px;

background:#fff8fb;

border-radius:20px;

text-align:left;

font-size:17px;

line-height:2;

color:#666;

}


</style>


</head>


<body>


<div class="box">


<h1>
💌 伟峰的情话信箱
</h1>


<div class="envelope">
✉️
</div>


<p>
佳源，今天想收到一封来自伟峰的信吗？
</p >


<button onclick="openLetter()">

拆开这封信 💕

</button>



<div class="letter" id="letter">


佳源：


<br><br>


其实我一直觉得，

最幸运的事情，

就是在人生里遇见你。


<br><br>


从2024年12月14日开始，

我们的故事慢慢展开。


<br><br>


一起去韩国旅行，

一起做海鲜葱饼，

一起在杨村三中的天台留下回忆。


<br><br>


希望以后还有很多很多个普通的日子，

可以和你一起吃饭，

一起散步，

一起创造新的故事。


<br><br>


永远站在你这边。

<br><br>


爱你的伟峰 ❤️


</div>


</div>




<script>

function openLetter(){

document.getElementById("letter").style.display="block";

}

</script>


</body>


</html>
