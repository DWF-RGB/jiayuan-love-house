<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的情话信箱</title>


<style>


*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;


    background:
    linear-gradient(135deg,#ffe6f0,#fff8fb);


    font-family:
    "Microsoft YaHei",
    sans-serif;

}



/* 页面盒子 */


.box{

    width:100%;

    max-width:420px;

    text-align:center;

}



/* 返回按钮 */


.back{

    position:absolute;

    top:25px;

    left:25px;


    color:#ff7fa8;

    text-decoration:none;

}



/* 标题 */


h1{

    color:#ff6b9d;

    font-size:30px;

    margin-bottom:40px;

}



/* 信封 */

.envelope{


    width:300px;

    height:200px;


    background:#ff91b5;


    margin:auto;


    position:relative;


    border-radius:15px;


    cursor:pointer;


    box-shadow:

    0 15px 30px rgba(255,120,160,0.25);


    overflow:hidden;

}



/* 信封盖 */


.flap{


    position:absolute;


    width:0;

    height:0;


    border-left:150px solid transparent;

    border-right:150px solid transparent;

    border-top:100px solid #ffb3cc;


    top:0;

    left:0;


    transform-origin:top;


    transition:0.8s;


    z-index:3;

}



/* 信纸 */


.letter{


    position:absolute;


    width:260px;


    height:260px;


    background:white;


    left:20px;


    top:40px;


    padding:25px;


    border-radius:10px;


    text-align:left;


    color:#666;


    line-height:1.8;


    font-size:16px;


    transition:0.8s;


    z-index:2;


    box-shadow:

    0 5px 20px rgba(0,0,0,0.08);


}



/* 点击打开 */


.open .flap{


    transform:rotateX(180deg);


}



.open .letter{


    transform:translateY(-170px);


}



/* 提示文字 */


.tip{


    margin-top:35px;


    color:#ff8fb5;


}



</style>


</head>



<body>



<a class="back" href="index.html">

← 回到小屋

</a>



<div class="box">


<h1>

💌 伟峰的情话信箱

</h1>



<div class="envelope" onclick="openLetter()">



<div class="flap"></div>



<div class="letter">


亲爱的佳源：


<br><br>


这是伟峰为你准备的小信箱。


<br><br>


希望以后每一次打开，

都能看到一点小惊喜。


<br><br>


愿你每天开心一点，

也愿我们的故事一直继续。


<br><br>


——伟峰 ❤️



</div>


</div>



<div class="tip">

点击信封，打开信件 💕

</div>



</div>



<script>


function openLetter(){


    document
    .querySelector(".envelope")
    .classList
    .toggle("open");


}



</script>


</body>

</html>
