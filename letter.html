<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的情话信箱</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

background:linear-gradient(
135deg,
#ffe8f0,
#fff9fc
);

font-family:"Microsoft YaHei",sans-serif;

animation:fadeIn 0.8s ease;

}


@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}


/* 返回 */

.back{

position:fixed;

top:20px;

left:20px;

text-decoration:none;

color:#ff8fb5;

font-size:16px;

}


/* 主体 */

.box{

width:100%;

max-width:420px;

background:white;

padding:40px 25px;

border-radius:30px;

text-align:center;

box-shadow:
0 15px 35px rgba(255,120,160,0.2);

}



/* 标题 */

h1{

color:#ff6b9d;

font-size:30px;

margin-bottom:20px;

}


/* 信封 */

.envelope{

font-size:75px;

margin:25px;

animation:float 2s infinite ease-in-out;

}



@keyframes float{

50%{

transform:translateY(-8px);

}

}


/* 提示 */

.tip{

font-size:17px;

color:#777;

line-height:1.8;

}



/* 按钮 */

button{

margin-top:25px;

width:90%;

padding:18px;

border:none;

border-radius:50px;

background:
linear-gradient(
135deg,
#ff9fc4,
#ff7da8
);

color:white;

font-size:18px;

cursor:pointer;

}


/* 信 */

.letter{

display:none;

margin-top:30px;

padding:25px;

background:#fffdf8;

border-radius:12px;

text-align:left;

font-size:17px;

line-height:2;

color:#666;

box-shadow:
0 10px 30px rgba(0,0,0,0.08);

animation:show 0.8s ease;

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.letter h2{

text-align:center;

color:#ff6b9d;

font-size:22px;

}



.date{

text-align:right;

color:#aaa;

font-size:14px;

margin-top:20px;

}



/* 小信列表 */

.more{

display:none;

margin-top:25px;

}



.more h3{

color:#ff6b9d;

}



.card{

background:#fff5fa;

padding:15px;

border-radius:18px;

margin:15px 0;

cursor:pointer;

text-align:left;

line-height:1.7;

transition:0.3s;

}



.card:hover{

transform:translateY(-3px);

}



</style>


</head>




<body>



<a href="index.html" class="back">

← 回到小屋

</a>




<div class="box">


<h1>

💌 伟峰的情话信箱

</h1>



<div class="envelope">

💌

</div>




<div class="tip">

佳源，

<br>

今天想收到一封来自伟峰的信吗？😊

</div>



<button onclick="openBox()">

拆开这封信 💕

</button>





<div class="letter" id="letter">


<h2 id="title">

今天想告诉你

</h2>


<p id="content">

佳源：

<br><br>


今天没有发生什么特别的事情，

但是想到生活里有你的存在，

就觉得很幸运。


<br><br>


希望以后我们可以一起经历很多普通的日子，

一起吃饭，

一起散步，

一起创造属于我们的故事。


<br><br>


爱你的伟峰 ❤️


</p>



<div class="date" id="date">

2026年8月11日

</div>



</div>






<div class="more" id="more">


<h3>

📮 更多的小信

</h3>



<div class="card" onclick="changeLetter(1)">

💌 韩国旅行回忆

<br>

那次一起出发的日子

</div>




<div class="card" onclick="changeLetter(2)">

💌 杨村三中的天台

<br>

关于我们的青春记忆

</div>




<div class="card" onclick="changeLetter(3)">

💌 写给未来的你

<br>

几年后的我们

</div>



</div>




</div>





<script>


function openBox(){


document.getElementById("letter").style.display="block";


document.getElementById("more").style.display="block";


document.querySelector("button").style.display="none";


document.querySelector(".tip").style.display="none";


}





function changeLetter(num){


let title=document.getElementById("title");

let content=document.getElementById("content");

let date=document.getElementById("date");



if(num==1){


title.innerHTML="韩国旅行回忆";


content.innerHTML=

"佳源：<br><br>"+
"还记得我们一起去韩国的日子吗？"+
"<br><br>"+
"一起走过陌生的街道，"+
"一起吃饭，一起看风景。"+
"<br><br>"+
"很多时候，旅行的意义不是去了哪里，"+
"而是身边的人是谁。❤️";


date.innerHTML="2025年旅行记录";


}




if(num==2){


title.innerHTML="杨村三中的天台";


content.innerHTML=

"佳源：<br><br>"+
"有些地方很普通，"+
"但是因为有了共同的回忆，"+
"就变得特别。"+
"<br><br>"+
"希望以后我们还能创造更多属于我们的地方。";


date.innerHTML="我们的回忆";


}





if(num==3){


title.innerHTML="写给未来的你";


content.innerHTML=

"佳源：<br><br>"+
"如果未来的某一天你打开这封信，"+
"希望我们依然记得现在喜欢彼此的感觉。"+
"<br><br>"+
"愿未来的我们，"+
"一起面对生活，也一起享受生活。❤️";


date.innerHTML="未来信";


}



}


</script>



</body>

</html>
