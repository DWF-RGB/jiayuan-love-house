<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>伟峰的情话信箱</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;


background:

linear-gradient(
135deg,
#ffe8f0,
#fff9fc
);


font-family:
"Microsoft YaHei",
sans-serif;


animation:fadeIn 0.8s ease;

}



@keyframes fadeIn{

from{
opacity:0;
}

to{
opacity:1;
}

}



/* 返回按钮 */

.back{

position:fixed;

top:20px;

left:20px;


color:#ff8fb5;


text-decoration:none;


font-size:16px;

}



/* 主卡片 */

.box{

width:100%;


max-width:420px;


background:white;


padding:40px 25px;


border-radius:30px;


text-align:center;


box-shadow:

0 15px 35px rgba(255,120,160,0.2);


}



/* 标题 */

h1{

color:#ff6b9d;


font-size:30px;


margin-bottom:25px;


}



/* 信封 */


.envelope{


font-size:75px;


margin:25px;


animation:

float 2s infinite ease-in-out;


}



@keyframes float{


0%,100%{

transform:translateY(0);

}


50%{

transform:translateY(-8px);

}


}



/* 提示文字 */


.tip{


font-size:17px;


color:#777;


line-height:1.8;


}



/* 按钮 */


button{


margin-top:25px;


width:90%;


padding:18px;


border:none;


border-radius:50px;


background:

linear-gradient(
135deg,
#ff9fc4,
#ff7da8
);


color:white;


font-size:18px;


cursor:pointer;


box-shadow:

0 8px 20px rgba(255,120,160,0.25);


}



/* 信纸 */


.letter{


display:none;


margin-top:30px;


padding:28px;


background:#fffdf8;


border-radius:8px;


text-align:left;


font-size:17px;


line-height:2;


color:#666;


box-shadow:

0 10px 30px rgba(0,0,0,0.08);


animation:

letterShow 0.8s ease;


}



@keyframes letterShow{


from{

opacity:0;

transform:

translateY(40px);

}


to{

opacity:1;

transform:

translateY(0);

}


}



/* 信件标题 */


.letter h2{

color:#ff6b9d;

text-align:center;

font-size:22px;

}



/* 日期 */


.date{


text-align:right;


font-size:14px;


color:#aaa;


margin-top:20px;


}



/* 更多小信 */


.more-letter{


margin-top:25px;


padding:20px;


background:#fff5fa;


border-radius:20px;


text-align:left;


color:#777;


line-height:1.8;


}



.more-letter h3{


text-align:center;


color:#ff6b9d;


}



.more-letter p{


padding:15px;


background:white;


border-radius:15px;


margin:15px 0;


box-shadow:

0 5px 15px rgba(0,0,0,0.05);


}




</style>


</head>




<body>



<a href="index.html" class="back">

← 回到小屋

</a>




<div class="box">



<h1>

💌 伟峰的情话信箱

</h1>




<div class="envelope">

💌

</div>




<div class="tip">

佳源，

<br>

今天想收到一封来自伟峰的信吗？😊

</div>





<button onclick="openLetter()">

今天收到一封信 💌

</button>






<div class="letter" id="letter">



<h2>

今天想告诉你

</h2>



<p>

佳源：

</p>




<p>

今天没有发生什么特别的事情，

但是想到生活里有你的存在，

就觉得很幸运。

</p>



<p>

希望以后我们可以一起经历更多普通的日子，

一起吃饭，

一起散步，

一起把平凡的生活过成我们的故事。

</p>



<p>

无论什么时候，

伟峰都会站在你这边。

</p>



<p>

爱你的伟峰 ❤️

</p>




<div class="date">

2026年8月11日

</div>



</div>







<div class="more-letter">


<h3>

📮 更多的小信

</h3>



<p>

💌 2026.08.05

<br>

想记录我们的日常

</p>



<p>

💌 2026.07.20

<br>

想和你一起慢慢变老

</p>




<p>

💌 未来信

<br>

写给几年后的我们

</p>



</div>





</div>







<script>


function openLetter(){


let letter=document.getElementById("letter");


letter.style.display="block";


document.querySelector("button").style.display="none";


document.querySelector(".tip").style.display="none";


}



</script>






</body>

</html>
