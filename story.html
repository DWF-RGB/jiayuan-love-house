<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我们的故事</title>


<style>


*{
box-sizing:border-box;
}


body{

margin:0;

min-height:100vh;

padding:30px 20px;

background:

linear-gradient(
135deg,
#ffe8f0,
#fff9fc
);

font-family:
"Microsoft YaHei",
sans-serif;

}



.back{

position:fixed;

top:20px;

left:20px;

color:#ff8fb5;

text-decoration:none;

}




.story-box{

max-width:420px;

margin:auto;

background:white;

padding:35px 25px;

border-radius:30px;

box-shadow:

0 15px 35px rgba(255,120,160,0.2);

}



h1{

text-align:center;

color:#ff6b9d;

font-size:30px;

}



.intro{

text-align:center;

color:#777;

line-height:2;

margin-bottom:40px;

}




/* 时间轴 */

.timeline{

position:relative;

padding-left:35px;

}



/* 中间线 */

.timeline::before{

content:"";

position:absolute;

left:10px;

top:0;

bottom:0;

width:3px;

background:#ffd0df;

}




.story-card{

position:relative;

background:#fff7fa;

padding:20px;

border-radius:20px;

margin-bottom:35px;

opacity:0;

transform:translateY(40px);

transition:0.8s;

}



/* 出现 */

.story-card.show{

opacity:1;

transform:translateY(0);

}




/* 时间点 */

.dot{

position:absolute;

left:-35px;

top:25px;

width:22px;

height:22px;

background:#ff8fb5;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:13px;

}




.icon{

font-size:35px;

}



h2{

color:#ff6b9d;

font-size:20px;

}



.date{

color:#aaa;

font-size:14px;

}



p{

color:#777;

line-height:1.8;

}





</style>


</head>




<body>



<a href="index.html" class="back">

← 回到小屋

</a>




<div class="story-box">


<h1>

📖 我们的故事

</h1>



<div class="intro">


从2024年12月14日开始，

<br>

我们的故事慢慢展开。

<br>

未来还有很多页等待书写。

</div>






<div class="timeline">





<div class="story-card">


<div class="dot">

❤️

</div>


<div class="icon">

❤️

</div>


<h2>

故事的开始

</h2>


<div class="date">

2024年12月14日

</div>


<p>

那一天，也许只是普通的一天。

<br>

但后来才发现，

它成为了我们故事开始的地方。

</p>


</div>







<div class="story-card">


<div class="dot">

🇰🇷

</div>


<div class="icon">

🇰🇷

</div>


<h2>

一起去韩国

</h2>


<div class="date">

旅行回忆

</div>


<p>

一起走过陌生的城市，

一起吃饭，

一起留下属于我们的记忆。

</p>


</div>








<div class="story-card">


<div class="dot">

🏫

</div>


<div class="icon">

🏫

</div>


<h2>

杨村三中的天台

</h2>


<div class="date">

我们的回忆

</div>


<p>

有些地方其实很普通，

<br>

但因为和你一起去过，

所以变得特别。

</p>


</div>







<div class="story-card">


<div class="dot">

✨

</div>


<div class="icon">

✨

</div>


<h2>

未完待续

</h2>


<div class="date">

未来

</div>


<p>

我们的故事，

还有很多很多页。

</p>


</div>





</div>



</div>





<script>


let cards=document.querySelectorAll(".story-card");



function showCards(){


cards.forEach(card=>{


let top=
card.getBoundingClientRect().top;


if(top < window.innerHeight-100){

card.classList.add("show");

}


});


}



window.addEventListener(
"scroll",
showCards
);


showCards();



</script>




</body>

</html>
